<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>PDF Books</title>

<style>
:root{
  --bg:#0b0b0d;
  --card:#151518;
  --card2:#1d1d21;
  --red:#e50914;
  --red2:#ff3340;
  --text:#fff;
  --muted:#a6a6ad
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(11,11,13,.94);
  backdrop-filter:blur(14px);
  padding:18px 16px 12px;
  border-bottom:1px solid #242429
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.brand{
  display:flex;
  align-items:center;
  gap:11px
}

.brand img{
  width:42px;
  height:42px;
  border-radius:12px;
  object-fit:cover
}

.brand h1{
  font-size:21px;
  margin:0
}

.brand small{
  color:var(--muted)
}

.language{
  position:relative
}

.lang-btn{
  background:var(--card2);
  color:#fff;
  border:1px solid #29292e;
  border-radius:10px;
  padding:9px 11px;
  font-size:13px;
  cursor:pointer
}

.lang-menu{
  display:none;
  position:absolute;
  right:0;
  top:44px;
  background:var(--card2);
  border:1px solid #303038;
  border-radius:12px;
  overflow:hidden;
  min-width:130px;
  z-index:50
}

.lang-menu button{
  width:100%;
  background:none;
  color:#fff;
  border:0;
  padding:11px 13px;
  text-align:left;
  cursor:pointer
}

.lang-menu button:hover{
  background:#29292f
}

.language.open .lang-menu{
  display:block
}

.search{
  margin-top:16px;
  display:flex;
  gap:8px;
  background:var(--card2);
  border:1px solid #29292e;
  border-radius:14px;
  padding:11px 13px
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:none;
  color:#fff;
  font-size:16px
}

main{
  padding:18px 16px 90px
}

.hero{
  background:linear-gradient(135deg,#19191d,#2a0d10);
  border:1px solid #3a2022;
  border-radius:20px;
  padding:20px
}

.hero h2{
  margin:0 0 7px;
  font-size:26px
}

.hero p{
  margin:0;
  color:#c2c2c8
}

.section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:24px 0 12px
}

.section h3{
  margin:0;
  font-size:19px
}

.section span{
  color:var(--red2);
  font-size:13px
}

.cats{
  display:flex;
  gap:9px;
  overflow:auto;
  padding-bottom:3px
}

.cat{
  flex:0 0 auto;
  background:var(--card2);
  border:1px solid #2a2a30;
  color:#fff;
  border-radius:999px;
  padding:9px 14px;
  font-size:14px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px
}

.book{
  background:var(--card);
  border:1px solid #26262b;
  border-radius:16px;
  overflow:hidden
}

.cover{
  height:190px;
  background:linear-gradient(145deg,#2a2a30,#101012);
  display:flex;
  align-items:center;
  justify-content:center
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover
}

.book .info{
  padding:11px
}

.book h4{
  margin:0 0 5px;
  font-size:15px
}

.book p{
  margin:0;
  color:var(--muted);
  font-size:12px
}

.btn{
  margin-top:10px;
  width:100%;
  border:0;
  border-radius:10px;
  padding:9px;
  background:var(--red);
  color:#fff;
  font-weight:700
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(15,15,18,.96);
  border-top:1px solid #27272c;
  display:flex;
  justify-content:space-around;
  padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  z-index:20
}

nav button{
  background:none;
  border:0;
  color:#aaa;
  font-size:12px
}

nav button.active{
  color:#fff
}

nav b{
  display:block;
  font-size:18px;
  margin-bottom:2px
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:28px 10px;
  display:none
}

@media(min-width:700px){
  main{
    max-width:900px;
    margin:auto
  }

  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr))
  }

  .cover{
    height:220px
  }
}
</style>
</head>

<body>

<header>

  <div class="top">

    <div class="brand">
      <img src="logo.png" alt="PDF Books">
      <div>
        <h1>PDF Books</h1>
        <small data-i18n="tagline">Read • Learn • Grow</small>
      </div>
    </div>

    <div class="language" id="language">
      <button class="lang-btn" onclick="toggleLanguage()">
        🌐 <span id="currentLang">EN</span> ▾
      </button>

      <div class="lang-menu">
        <button onclick="setLanguage('en')">🇬🇧 English</button>
        <button onclick="setLanguage('uz')">🇺🇿 O‘zbekcha</button>
      </div>
    </div>

  </div>

  <label class="search">
    🔎
    <input
      id="search"
      data-i18n-placeholder="search"
      placeholder="Search books..."
      autocomplete="off">
  </label>

</header>

<main>

  <section class="hero">
    <h2 data-i18n="welcome">Welcome to the world of books 📚</h2>
    <p data-i18n="welcomeText">
      Find, choose and read your favorite books.
    </p>
  </section>

  <div class="section">
    <h3 data-i18n="categories">Categories</h3>
    <span data-i18n="all">All</span>
  </div>

  <div class="cats">
    <button class="cat" data-cat="all" data-i18n="all">All</button>
    <button class="cat" data-cat="english" data-i18n="english">English</button>
    <button class="cat" data-cat="business" data-i18n="business">Business</button>
    <button class="cat" data-cat="science" data-i18n="science">Science</button>
    <button class="cat" data-cat="it" data-i18n="it">IT</button>
    <button class="cat" data-cat="history" data-i18n="history">History</button>
    <button class="cat" data-cat="fiction" data-i18n="fiction">Fiction</button>
  </div>

  <div class="section">
    <h3 data-i18n="popular">Popular Books</h3>
    <span data-i18n="more">More</span>
  </div>

  <div id="grid" class="grid"></div>

  <div id="empty" class="empty" data-i18n="notFound">
    No books found.
  </div>

</main>

<nav>
  <button class="active" onclick="showHome()">
    <b>⌂</b>
    <span data-i18n="home">Home</span>
  </button>

  <button>
    <b>▦</b>
    <span data-i18n="categories">Categories</span>
  </button>

  <button onclick="showFavorites()">
  <b>★</b>
  <span data-i18n="favorites">Favorites</span>
  </button>

  <button onclick="shareSite()">
    <b>↗</b>
    <span data-i18n="share">Share</span>
  </button>
</nav>

<script>

const translations = {

  en:{
    tagline:"Read • Learn • Grow",
    search:"Search books...",
    welcome:"Welcome to the world of books 📚",
    welcomeText:"Find, choose and read your favorite books.",
    categories:"Categories",
    all:"All",
    english:"English",
    business:"Business",
    science:"Science",
    it:"IT",
    history:"History",
    fiction:"Fiction",
    popular:"Popular Books",
    more:"More",
    notFound:"No books found.",
    home:"Home",
    favorites:"Favorites",
    share:"Share",
    open:"Open PDF",
    favorite:"Favorite",
    pdf:"PDF"
  },

  uz:{
    tagline:"O‘qing • O‘rganing • Rivojlaning",
    search:"Kitob qidirish...",
    welcome:"Kitoblar olamiga xush kelibsiz 📚",
    welcomeText:"Sevimli kitoblaringizni toping, tanlang va o‘qing.",
    categories:"Kategoriyalar",
    all:"Barchasi",
    english:"Ingliz tili",
    business:"Biznes",
    science:"Ilmiy",
    it:"IT",
    history:"Tarix",
    fiction:"Badiiy adabiyot",
    popular:"Mashhur kitoblar",
    more:"Ko‘proq",
    notFound:"Kitob topilmadi.",
    home:"Bosh sahifa",
    favorites:"Sevimlilar",
    share:"Ulashish",
    open:"PDF ochish",
    favorite:"Sevimlilarga qo‘shish",
    pdf:"PDF"
  }

};

const books=[
  {
    title:"Alice's Adventures in Wonderland",
    author:"Lewis Carroll",
    cat:"fiction",
    meta:"Fiction • Public Domain",
    cover:"images.jpeg",
    pdf:"https://www.gutenberg.org/ebooks/11"
  },

  {
    title:"English Grammar",
    author:"Sample Book",
    cat:"english",
    meta:"English • PDF",
    cover:"logo.png",
    pdf:"#"
  },

  {
    title:"Business Basics",
    author:"Sample Book",
    cat:"business",
    meta:"Business • PDF",
    cover:"logo.png",
    pdf:"#"
  },

  {
    title:"Computer Science",
    author:"Sample Book",
    cat:"it",
    meta:"IT • PDF",
    cover:"logo.png",
    pdf:"#"
  },

  {
    title:"World History",
    author:"Sample Book",
    cat:"history",
    meta:"History • PDF",
    cover:"logo.png",
    pdf:"#"
  },

  {
   title:"A Brief History of Time",
   author:"Stephen Hawking",
   cat:"science",
   meta:"Science • PDF",
   cover:"logo.png",
   pdf:"https://books.google.com/books?id=E7mEnx3zE4AC"
  },
  
  {
    title:"Learn English",
    author:"Sample Book",
    cat:"english",
    meta:"English • PDF",
    cover:"logo.png",
    pdf:"#"
  }
];

const grid=document.querySelector('#grid');
const empty=document.querySelector('#empty');
const search=document.querySelector('#search');

let category='all';
let language=localStorage.getItem('language') || 'en';
let currentPage='home';

let favorites=JSON.parse(
  localStorage.getItem('pdfBooksFavorites') || '[]'
);
function toggleLanguage(){
  document
    .getElementById('language')
    .classList.toggle('open');
  }
  function showFavorites(){

  currentPage='favorites';

  category='all';

  render();

  document
    .querySelectorAll('nav button')
    .forEach(button=>button.classList.remove('active'));

  document
    .querySelectorAll('nav button')[2]
    .classList.add('active');
}

function showHome(){

  currentPage='home';

  render();

  document
    .querySelectorAll('nav button')
    .forEach(button=>button.classList.remove('active'));

  document
    .querySelectorAll('nav button')[0]
    .classList.add('active');
}
function toggleFavorite(title){

  if(favorites.includes(title)){
    favorites=favorites.filter(book=>book!==title);
  }else{
    favorites.push(title);
  }

  localStorage.setItem(
    'pdfBooksFavorites',
    JSON.stringify(favorites)
  );

  render();
  }
function setLanguage(lang){

  language=lang;

  localStorage.setItem('language',lang);

  document.getElementById('currentLang').textContent =
    lang === 'en' ? 'EN' : 'UZ';

  document.querySelectorAll('[data-i18n]').forEach(element=>{

    const key=element.dataset.i18n;

    if(translations[lang][key]){
      element.textContent=translations[lang][key];
    }

  });

  document.querySelectorAll('[data-i18n-placeholder]').forEach(element=>{

    const key=element.dataset.i18nPlaceholder;

    if(translations[lang][key]){
      element.placeholder=translations[lang][key];
    }

  });

  render();

  document
    .getElementById('language')
    .classList.remove('open');
}

function render(){

  const q=search.value.toLowerCase().trim();

  let list=books.filter(book =>
  (category==='all' || book.cat===category) &&
  (!q || book.title.toLowerCase().includes(q))
);

if(currentPage==='favorites'){
  list=list.filter(book=>favorites.includes(book.title));
  }

  const t=translations[language];

  grid.innerHTML=list.map(book=>`

    <article class="book">

      <div class="cover">
        <img src="${book.cover}" alt="${book.title}">
      </div>

      <div class="info">

        <h4>${book.title}</
        h4>

        <p>${book.author}</p>

        <p>${book.meta}</p>

        <button
          class="btn"
          onclick="openBook('${book.pdf}')">
          ${t.open}
        </button>
<button
  class="favorite-btn"
  onclick="toggleFavorite('${book.title.replace(/'/g,"\\'")}')">
  ${favorites.includes(book.title) ? '★' : '☆'}
  ${t.favorite}
</button>

     </div>

    </article>

  `).join('');

  empty.style.display=list.length ? 'none' : 'block';
}

function openBook(url){

  if(url && url !== "#"){
    window.open(url, "_blank");
    return;
  }

  alert(
    language === 'en'
    ? 'This book is not available yet.'
    : 'Bu kitob hali mavjud emas.'
  );

}

function shareSite(){

  const url=window.location.href;

  if(navigator.share){

    navigator.share({
      title:'PDF Books',
      text:'PDF Books – Online Library',
      url:url
    });

  }else{

    navigator.clipboard.writeText(url);

    alert(
      language === 'en'
      ? 'Link copied!'
      : 'Havola nusxalandi!'
    );

  }

}

document.querySelectorAll('.cat').forEach(button=>{

  button.onclick=()=>{

    category=button.dataset.cat;

    render();

  };

});

search.oninput=render;

setLanguage(language);

</script>

</body>
</html>
